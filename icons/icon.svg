<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2545"/>
      <stop offset="1" stop-color="#0b0f1c"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="512" height="512" rx="110"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Projecteur des Agents (bleu) qui balaie depuis le coin -->
    <path d="M0 0 L225 0 L130 512 L0 512 Z" fill="#4c8dff" opacity="0.13"/>
    <path d="M0 0 L150 0 L80 512 L0 512 Z" fill="#4c8dff" opacity="0.12"/>
    <path d="M96 96 L118 158 L184 158 L131 197 L150 260 L96 222 L42 260 L61 197 L8 158 L74 158 Z"
          fill="#4c8dff" opacity="0.9"/>

    <!-- Mur derrière lequel l'espion se cache -->
    <rect x="296" y="0" width="216" height="512" fill="#070a14"/>
    <rect x="294" y="0" width="5" height="512" fill="#2a3a61"/>

    <!-- L'espion qui épie (chapeau, masque, yeux vers le projecteur) -->
    <path d="M225 202 Q225 128 285 128 Q345 128 345 202 Z" fill="#e5484d"/>
    <ellipse cx="283" cy="207" rx="97" ry="19" fill="#e5484d"/>
    <rect x="232" y="216" width="106" height="60" rx="20" fill="#e5484d"/>
    <rect x="226" y="226" width="118" height="28" rx="14" fill="#0b0f1c"/>
    <circle cx="261" cy="240" r="11" fill="#ffffff"/>
    <circle cx="303" cy="240" r="11" fill="#ffffff"/>
    <circle cx="256" cy="240" r="5" fill="#0b0f1c"/>
    <circle cx="298" cy="240" r="5" fill="#0b0f1c"/>

    <!-- Doigts agrippés au bord du mur -->
    <rect x="270" y="308" width="30" height="15" rx="7.5" fill="#e5484d"/>
    <rect x="266" y="332" width="34" height="15" rx="7.5" fill="#e5484d"/>
    <rect x="270" y="356" width="30" height="15" rx="7.5" fill="#e5484d"/>

    <!-- Épaule qui dépasse en bas -->
    <path d="M296 512 L296 396 Q252 410 240 452 Q233 484 246 512 Z" fill="#b83338"/>
  </g>
</svg>
